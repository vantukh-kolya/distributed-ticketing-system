resolver 127.0.0.11 valid=10s ipv6=off;

upstream booking_backend {
    zone booking_backend 64k;
    server booking:8000 resolve;
}

upstream inventory_backend {
    zone inventory_backend 64k;
    server inventory:8000 resolve;
}

upstream orchestrator_backend {
    zone orchestrator_backend 64k;
    server orchestrator:8000 resolve;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    location /api/booking/ {
        proxy_pass http://booking_backend/api/;
        proxy_set_header Host $host;
    }

    location /api/inventory/ {
        proxy_pass http://inventory_backend/api/;
        proxy_set_header Host $host;
    }

    location /api/orchestrator/ {
        proxy_pass http://orchestrator_backend/api/;
        proxy_set_header Host $host;
    }
}
